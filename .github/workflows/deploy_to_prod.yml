name: Build & deploy to server

on:
  push:
    branches:
      - deploy

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      REMOTE_PATH: /home/deploy/apps/alexandrie

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      # -------------------------
      # Build frontend and backend
      # -------------------------
      - name: Build Go backend
        run: |
          cd backend
          go mod download
          GOOS=linux GOARCH=amd64 go build -o backend_app

      - name: Build frontend
        env:
          NUXT_PUBLIC_BASE_URL: https://alexandrie-hub.fr
          NUXT_PUBLIC_BASE_API: https://api.alexandrie-hub.fr
          NUXT_PUBLIC_BASE_CDN: https://cdn.alexandrie-hub.fr
        run: |
          cd frontend
          bun install
          bun run build

      - name: Build documentation
        run: |
          cd docs
          bun install
          bun run build

      # -------------------------
      # Prepare SSH connection
      # -------------------------
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          printf "%s" "${DEPLOY_SSH_KEY}" > deploy_key
          chmod 600 deploy_key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Test SSH connection
        run: |
          ssh -i deploy_key \
            -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "whoami && test \"\$(whoami)\" = \"deploy\""
      # -------------------------
      # Generate .env file with secrets & configuration
      # -------------------------
      - name: Create .env.production for application
        run: |
          cat > .env.production <<EOF
          NODE_ENV=production
          GIN_MODE=release
          BACKEND_PORT=8201
          DATABASE_USER=${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD="${{ secrets.DATABASE_PASSWORD }}"
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          MINIO_ACCESSKEY=${{ secrets.MINIO_ACCESSKEY }}
          MINIO_SECRETKEY=${{ secrets.MINIO_SECRETKEY }}
          OIDC_1_CONFIG_URL=${{ secrets.OIDC_GOOGLE_CONFIG }}
          OIDC_1_CLIENT_ID=${{ secrets.OIDC_GOOGLE_ID }}
          OIDC_1_CLIENT_SECRET=${{ secrets.OIDC_GOOGLE_SECRET }}
          OIDC_1_PROVIDER_NAME=Google
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_MAIL=${{ secrets.SMTP_MAIL }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          NUXT_PUBLIC_BASE_URL=https://alexandrie-hub.fr
          NUXT_PUBLIC_BASE_API=https://api.alexandrie-hub.fr
          NUXT_PUBLIC_BASE_CDN=https://cdn.alexandrie-hub.fr
          EOF
          chmod 600 .env.production
      # -------------------------
      # Deploy files using rsync
      # -------------------------
      - name: Deploy frontend & backend
        run: |
          rsync -avz  --delete --force --exclude 'server/node_modules' -e "ssh -i deploy_key" frontend/.output ${SSH_USER}@${SSH_HOST}:${REMOTE_PATH}/frontend
          rsync -avz  --delete --force --exclude 'server/node_modules' -e "ssh -i deploy_key" docs/.output ${SSH_USER}@${SSH_HOST}:${REMOTE_PATH}/docs
          rsync -avz --delete --force -e "ssh -i deploy_key" ecosystem.config.js ${SSH_USER}@${SSH_HOST}:${REMOTE_PATH}
          rsync -avz --delete --force -e "ssh -i deploy_key" backend/backend_app ${SSH_USER}@${SSH_HOST}:${REMOTE_PATH}/backend
          rsync -avz --delete --force -e "ssh -i deploy_key" .env.production ${SSH_USER}@${SSH_HOST}:${REMOTE_PATH}/.env.production

      - name: Install frontend dependencies on server
        run: |
          ssh -i deploy_key ${SSH_USER}@${SSH_HOST} "
            set -e
            rm -rf ${REMOTE_PATH}/frontend/.output/server/node_modules
            cd ${REMOTE_PATH}/frontend/.output/server

            export BUN_INSTALL=\"/home/deploy/.bun\"
            export PATH=\"\$BUN_INSTALL/bin:\$PATH\"

            bun install --production
          "

      - name: Install documentation dependencies on server
        run: |
          ssh -i deploy_key ${SSH_USER}@${SSH_HOST} "
            set -e
            rm -rf ${REMOTE_PATH}/docs/.output/server/node_modules
            cd ${REMOTE_PATH}/docs/.output/server
            bun install --production
          "
      # -------------------------
      # Restart application with PM2
      # -------------------------
      - name: Restart application with pm2
        run: |
          ssh -i deploy_key ${SSH_USER}@${SSH_HOST} "
            set -e
            cd ${REMOTE_PATH}
            # Load environment variables
            set -o allexport
            source .env.production
            set +o allexport

            export BUN_INSTALL=\"/home/deploy/.bun\"
            export PATH=\"\$BUN_INSTALL/bin:\$PATH\"
            
            # Reload or start the application
            pm2 delete ecosystem.config.js || true
            pm2 start ecosystem.config.js
            pm2 save
          "
